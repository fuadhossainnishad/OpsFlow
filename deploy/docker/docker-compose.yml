services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opsflow-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - opsflow_sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  redis:
    image: redis:7-alpine
    container_name: opsflow-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - opsflow_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: opsflow-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - opsflow_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  opsflow_sqlserver_data:
  opsflow_redis_data:
  opsflow_rabbitmq_data:
