services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opsflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OpsFlowDev_2026!StrongPassword"
    ports:
      - "1433:1433"
    volumes:
      - opsflow_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  opsflow_sqlserver_data:
